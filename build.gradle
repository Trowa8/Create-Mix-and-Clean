plugins {
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = '1.0'
base.archivesName = "modid"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = "21.1.232"

    runs {
        client {
            client()

            def mcreatorJvmOptions = System.getenv('MCREATOR_JVM_OPTIONS')
            if (mcreatorJvmOptions) {
                mcreatorJvmOptions.split("\\s+").findAll { it.trim() }.each { arg ->
                    jvmArgument(arg)
                }
            }
        }
        server {
            server()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        mcreator {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}


repositories { 
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url "https://maven.gegy.dev/releases" } // Registrate
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // ForgeConfigAPIPort
    maven { url = "https://modmaven.dev" } 
    maven { url = "https://cursemaven.com" }
    maven { url = "https://dvs1.progwml6.com/files/maven"}
}

dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    compileOnly("mekanism:Mekanism:${mekanism_version}:api")
    runtimeOnly("mekanism:Mekanism:${mekanism_version}")
    runtimeOnly("blusunrize.immersiveengineering:ImmersiveEngineering:${minecraft_version}-${ie_build}")
    implementation "curse.maven:jade-324717:7545219"
    implementation ("com.tterrag.registrate:Registrate:MC1.21.1-1.4.8")
    jarJar(group: 'com.tterrag.registrate', name: 'Registrate', version: "MC1.21.1-1.4.8")
}

jar {
    if (file("src/main/resources/create_mix_and_clean.mixins.json").exists()) {
        manifest.attributes([
                "MixinConfigs": "create_mix_and_clean.mixins.json"
        ])
    }
}

tasks.register('patchMCreatorGeneratedSources') {
    def blockEntitiesFile = file('src/main/java/net/mcreator/createmixandclean/init/CreateMixAndCleanModBlockEntities.java')
    def blocksFile        = file('src/main/java/net/mcreator/createmixandclean/init/CreateMixAndCleanModBlocks.java')
    def itemsFile         = file('src/main/java/net/mcreator/createmixandclean/init/CreateMixAndCleanModItems.java')

    doLast {
        // CreateMixAndCleanModBlockEntities.java
        if (blockEntitiesFile.exists()) {
            def text = blockEntitiesFile.text

            if (!text.contains('import net.neoforged.neoforge.capabilities.Capabilities;')) {
                text = text.replaceFirst('(package [^;]+;\\s*\\n)', '$1\nimport net.neoforged.neoforge.capabilities.Capabilities;\n')
            }

            text = text.replaceAll(
                '(?m)^.*event\\.registerBlockEntity\\(Capabilities\\.ItemHandler\\.BLOCK,\\s*ELECTROLYZER\\.get\\(\\),\\s*SidedInvWrapper::new\\);\\s*\\n',
                ''
            )

            text = text.replaceAll(
                'import net\\.neoforged\\.neoforge\\.items\\.wrapper\\.SidedInvWrapper;\\s*\\n',
                ''
            )

            blockEntitiesFile.text = text
        }

        // CreateMixAndCleanModBlocks.java
        if (blocksFile.exists()) {
            def text = blocksFile.text

            text = text.replaceAll(
                'REGISTRY\\.register\\("electrolyzer",\\s*ElectrolyzerBlock::new\\);',
                'REGISTRY.register("electrolyzer", () -> new ElectrolyzerBlock());'
            )

            blocksFile.text = text
        }

        // CreateMixAndCleanModItems.java
        if (itemsFile.exists()) {
            def text = itemsFile.text

            if (!text.contains('import net.neoforged.neoforge.capabilities.Capabilities;')) {
                text = text.replaceFirst('(package [^;]+;\\s*\\n)', '$1\nimport net.neoforged.neoforge.capabilities.Capabilities;\n')
            }

            itemsFile.text = text
        }
    }
}

compileJava.dependsOn patchMCreatorGeneratedSources

apply from: 'mcreator.gradle'
